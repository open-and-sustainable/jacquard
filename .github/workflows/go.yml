name: Go Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download pinned build dependencies
        run: go mod download
      - name: Verify module checksums
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Run synthetic tests with race detection
        run: go test -race -coverprofile=coverage.out ./...
        env:
          GOPROXY: "off"
          GOSUMDB: "off"

  interfaces:
    name: Formatting and C interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check excluded local notes
        run: test -z "$(git ls-files -- 'jacquard-specification*.md')"
      - name: Download pinned build dependencies
        run: go mod download
      - name: Build CLI and shared library
        run: |
          mkdir -p dist
          go build -o dist/jacquard ./cmd/jacquard
          go build -buildmode=c-shared -o dist/jacquard.so ./utils/sharedlib
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
      - name: Validate synthetic requests through CLI
        run: |
          dist/jacquard validate -type input < test/fixtures/check_input.json
          dist/jacquard validate -type funnel_input < test/fixtures/funnel_input.json
      - name: Test C exports with synthetic fixtures
        run: python3 test/shared_library_test.py dist/jacquard.so
