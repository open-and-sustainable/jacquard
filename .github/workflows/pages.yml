name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Check Pages publishing source
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Jacquard-Pages',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  enabled = json.load(response).get('build_type') == 'workflow'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          if not enabled:
              print('::notice::Select GitHub Actions in Settings > Pages, then rerun this workflow to publish the site.')
          PY

  deploy:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
